<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Firm — Case Documents</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="folder">
    <h1 class="case-title" id="case-title">&nbsp;</h1>
    <p class="case-opens" id="case-opens">&nbsp;</p>
    <ul class="doc-list" id="doc-list"></ul>
  </aside>

  <main class="reading-area" id="reading-area">
    <div class="reading-pane pinned-pane" id="pinned-pane"></div>
    <div class="reading-pane browse-pane" id="browse-pane">
      <p class="placeholder">Select a document from the folder to begin reading.</p>
    </div>
  </main>
</div>

<script src="main.js"></script>
</body>
</html>
