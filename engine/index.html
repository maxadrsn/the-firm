<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Firm — Case Documents</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="folder">
    <h1 class="case-title" id="case-title">&nbsp;</h1>
    <p class="case-opens" id="case-opens">&nbsp;</p>

    <ul class="doc-list" id="doc-list"></ul>

    <div class="folder-divider"></div>

    <button type="button" class="doc-list-item tool-entry" id="index-entry">
      <span class="doc-type-label">Criminal Record Office</span>
      <span class="doc-title-label">Card index &amp; notebook</span>
    </button>

    <button type="button" class="doc-list-item tool-entry report-entry" id="report-entry">
      <span class="doc-type-label">Investigating Officer</span>
      <span class="doc-title-label">Report of Investigating Officer</span>
    </button>
  </aside>

  <main class="reading-area" id="reading-area">
    <div class="reading-pane pinned-pane" id="pinned-pane"></div>
    <div class="reading-pane browse-pane" id="browse-pane">
      <p class="placeholder">Select a document from the folder to begin reading.</p>
    </div>
  </main>
</div>

<div class="mark-popup" id="mark-popup" hidden>
  <button type="button" id="mark-add">Highlight</button>
</div>

<script src="main.js"></script>
</body>
</html>
